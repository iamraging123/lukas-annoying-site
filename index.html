      cursor: pointer;

      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 12px gold;
    }
    .claim-button:hover {

    }
    .countdown {
      color: red;
      font-weight: bold;
      font-size: 22px;
      margin: 8px 0;
    }
    .timer {
      background: #000;
      color: #0f0;
      padding: 3px 10px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .testimonials {

      color: #444;

    }
    .testimonials p { margin: 4px 0; }
    .trust-badges {
      font-weight: bold;
      margin: 12px;
      font-size: 14px;
      color: navy;
    }
    .trust-badges span {
      display: inline-block;
      margin: 4px;
      padding: 4px 8px;
      background: #f0f0f0;
      border: 1px solid #999;
    }
    .instructions {
      font-size: 24px;
      color: blue;
      text-decoration: underline;
      animation: wiggle 0.5s infinite;
      margin-top: 18px;
    }
    .fine-print {
      font-size: 9px;
      color: #888;
      margin-top: 14px;
      max-height: 40px;
      overflow: hidden;
    }
    .logout-messages {
      pointer-events: none;
      color: red;
      margin: 40px;
      position: fixed;
      top: 0;
      left: 0;
      text-shadow: 2px 2px #FFF, 4px 4px 10px #000;
      z-index: 9999;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes blink {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes blurslowly {
      0% { filter: none; }
      92% { filter: blur(0); }
      96% { filter: blur(1px); }
      100% { filter: blur(0); }
    }
    body {
      animation-name: blurslowly;
      animation-iteration-count: infinite;
      animation-duration: 15s;
      animation-play-state: running;
    }
  </style>
</head>
